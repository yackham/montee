# Montée — construction de l'app dans le cloud (Codemagic), sans Mac.
# Le dépôt GitHub contient seulement ce fichier et montee-app.zip :
# chaque build commence par dézipper le projet, puis travaille dans le dossier montee/.
workflows:
  android-apk:
    name: Montée Android → APK de test
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Dézipper le projet
        script: |
          echo "Fichiers du dépôt :"; ls -la
          # S'il y a plusieurs zips, on prend le dernier envoyé sur GitHub
          Z=""; BEST=0
          for f in *.zip; do [ -f "$f" ] || continue; T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0); [ -z "$T" ] && T=0; echo "  $f (envoyé le $(date -r ${T:-0} 2>/dev/null))"; if [ "$T" -ge "$BEST" ]; then BEST=$T; Z="$f"; fi; done
          if [ -n "$Z" ]; then echo "Archive trouvée : $Z"; rm -rf montee && unzip -q -o "$Z"; fi
          if [ ! -d montee/web ] && [ -d web ] && [ -f package.json ]; then mkdir -p montee && cp -R android ios web scripts package.json package-lock.json capacitor.config.json montee/ 2>/dev/null; fi
          if [ ! -d montee/web ]; then echo "PROJET INTROUVABLE : envoie montee-app.zip à la racine du dépôt GitHub."; exit 1; fi
          ls montee
          echo "Version construite :"; grep -m1 versionName montee/android/app/build.gradle
      - name: Installer les dépendances
        script: cd montee && npm ci
      - name: Embarquer l'app web
        script: cd montee && npm run sync:android
      - name: Construire l'APK
        script: |
          cd montee/android
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk ../../dist/Montee.apk
    artifacts:
      - dist/Montee.apk

  android-playstore:
    name: Montée Android → Play Store (fichier .aab)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Dézipper le projet
        script: |
          echo "Fichiers du dépôt :"; ls -la
          # S'il y a plusieurs zips, on prend le dernier envoyé sur GitHub
          Z=""; BEST=0
          for f in *.zip; do [ -f "$f" ] || continue; T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0); [ -z "$T" ] && T=0; echo "  $f (envoyé le $(date -r ${T:-0} 2>/dev/null))"; if [ "$T" -ge "$BEST" ]; then BEST=$T; Z="$f"; fi; done
          if [ -n "$Z" ]; then echo "Archive trouvée : $Z"; rm -rf montee && unzip -q -o "$Z"; fi
          if [ ! -d montee/web ] && [ -d web ] && [ -f package.json ]; then mkdir -p montee && cp -R android ios web scripts package.json package-lock.json capacitor.config.json montee/ 2>/dev/null; fi
          if [ ! -d montee/web ]; then echo "PROJET INTROUVABLE : envoie montee-app.zip à la racine du dépôt GitHub."; exit 1; fi
          ls montee
          echo "Version construite :"; grep -m1 versionName montee/android/app/build.gradle
      - name: Installer les dépendances
        script: cd montee && npm ci
      - name: Embarquer l'app web
        script: cd montee && npm run sync:android
      - name: Construire le paquet Play Store
        script: |
          echo "Numéro de version Play Store : $((PROJECT_BUILD_NUMBER + 100))"
          cd montee/android
          chmod +x gradlew
          ./gradlew bundleRelease
          mkdir -p "$CM_BUILD_DIR/dist"
          cp app/build/outputs/bundle/release/app-release.aab "$CM_BUILD_DIR/dist/Montee.aab"
          # Fichier de désobscurcissement à importer dans la Play Console avec le .aab
          cp app/build/outputs/mapping/release/mapping.txt "$CM_BUILD_DIR/dist/Montee-mapping.txt" || echo "Pas de mapping.txt"
    artifacts:
      - dist/Montee.aab
      - dist/Montee-mapping.txt

  ios-testflight:
    name: Montée iPhone → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nom de la clé API App Store Connect ajoutée dans Codemagic (Team settings › Integrations)
      app_store_connect: Montee API
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.montennis.app
      vars:
        # À remplacer : App Store Connect › ton app › Informations sur l'app › Identifiant Apple
        APP_STORE_APPLE_ID: 0000000000
        XCODE_PROJECT: montee/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 20
      xcode: latest
    scripts:
      - name: Dézipper le projet
        script: |
          echo "Fichiers du dépôt :"; ls -la
          # S'il y a plusieurs zips, on prend le dernier envoyé sur GitHub
          Z=""; BEST=0
          for f in *.zip; do [ -f "$f" ] || continue; T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0); [ -z "$T" ] && T=0; echo "  $f (envoyé le $(date -r ${T:-0} 2>/dev/null))"; if [ "$T" -ge "$BEST" ]; then BEST=$T; Z="$f"; fi; done
          if [ -n "$Z" ]; then echo "Archive trouvée : $Z"; rm -rf montee && unzip -q -o "$Z"; fi
          if [ ! -d montee/web ] && [ -d web ] && [ -f package.json ]; then mkdir -p montee && cp -R android ios web scripts package.json package-lock.json capacitor.config.json montee/ 2>/dev/null; fi
          if [ ! -d montee/web ]; then echo "PROJET INTROUVABLE : envoie montee-app.zip à la racine du dépôt GitHub."; exit 1; fi
          ls montee
          echo "Version construite :"; grep -m1 versionName montee/android/app/build.gradle
      - name: Installer les dépendances
        script: cd montee && npm ci
      - name: Embarquer l'app web
        script: cd montee && npm run sync
      - name: Préparer la signature
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Construire l'app
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD=$((LATEST + 1))
          echo "Build n°$BUILD"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-simulator:
    name: Montée iPhone → test Appetize (simulateur, gratuit)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Dézipper le projet
        script: |
          echo "Fichiers du dépôt :"; ls -la
          # S'il y a plusieurs zips, on prend le dernier envoyé sur GitHub
          Z=""; BEST=0
          for f in *.zip; do [ -f "$f" ] || continue; T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0); [ -z "$T" ] && T=0; echo "  $f (envoyé le $(date -r ${T:-0} 2>/dev/null))"; if [ "$T" -ge "$BEST" ]; then BEST=$T; Z="$f"; fi; done
          if [ -n "$Z" ]; then echo "Archive trouvée : $Z"; rm -rf montee && unzip -q -o "$Z"; fi
          if [ ! -d montee/web ] && [ -d web ] && [ -f package.json ]; then mkdir -p montee && cp -R android ios web scripts package.json package-lock.json capacitor.config.json montee/ 2>/dev/null; fi
          if [ ! -d montee/web ]; then echo "PROJET INTROUVABLE : envoie montee-app.zip à la racine du dépôt GitHub."; exit 1; fi
          ls montee
          echo "Version construite :"; grep -m1 versionName montee/android/app/build.gradle
      - name: Installer les dépendances
        script: cd montee && npm ci
      - name: Embarquer l'app web
        script: cd montee && npm run sync
      - name: Construire pour le simulateur (sans signature)
        script: |
          mkdir -p "$CM_BUILD_DIR/dist"
          cd montee/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/simbuild" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          cd "$CM_BUILD_DIR/simbuild/Build/Products/Debug-iphonesimulator"
          zip -qry "$CM_BUILD_DIR/dist/Montee-iPhone-simulateur.zip" App.app
    artifacts:
      - dist/Montee-iPhone-simulateur.zip
