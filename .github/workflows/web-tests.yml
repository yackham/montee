# Tests rapides du code web (sans dépendance) : syntaxe, versions, moteur, liaison Ten'Up.
name: Montée tests web
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/*.test.js
